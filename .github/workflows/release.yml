name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          staging="jik-lsp-${{ github.ref_name }}-${{ matrix.artifact }}"
          mkdir -p "dist/$staging"
          if [ -f target/release/jik-lsp.exe ]; then
            cp target/release/jik-lsp.exe "dist/$staging/"
          else
            cp target/release/jik-lsp "dist/$staging/"
          fi
          cp README.md LICENSE "dist/$staging/"
          tar -C dist -czf "dist/$staging.tar.gz" "$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    # Manual dispatches only build artifacts; a Release needs a v* tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify artifacts
        run: ls -l dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
